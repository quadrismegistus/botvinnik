name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # The brain and the offline harness. `npm run check` is a plain tsc since the
  # Svelte app was retired — it used to be svelte-check, which covered brain/
  # only through the Svelte files importing it and never covered scripts/ at
  # all.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      # The retro engines' UCI contract, against the committed wasm — Node
      # only, about a second, no browser and no Flutter build. It earns its
      # place: sending the same `position` twice used to END the engine, and
      # every existing retro test sends exactly one, so the browser suite
      # stayed green through a bug that handed whole games to a Stockfish
      # stand-in. `with` is the assertion; `without` documents the failure and
      # is deliberately not a gate, since it asserts a bug that upstream may
      # fix (herohde/morlock#6).
      - name: retro engine survives a repeated position
        run: node scripts/retro-wasm/repeat-position.mjs with

      # vendor/retro/wasm_exec.js is Go's runtime shim with ONE local patch,
      # and the documented way to refresh it is `cp` from $(go env GOROOT) —
      # which silently removes the patch. Without this, that loss shows up as
      # an uncaught error in a player's console and nowhere else.
      - name: the local patch to the vendored Go shim is still there
        run: |
          grep -q 'LOCAL PATCH' vendor/retro/wasm_exec.js \
            || { echo "vendor/retro/wasm_exec.js lost its local patch — see scripts/retro-wasm/main.go" >&2; exit 1; }

  # The sync blob-store Worker (issue #203). Its own npm package under worker/,
  # so it installs and tests independently of the brain. `npm test` drives the
  # real Worker through Miniflare (workerd + an in-memory R2), which is where the
  # conditional-PUT compare-and-swap the whole design leans on is actually
  # exercised. `typecheck` covers the deployable source.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The vendored dartchess fork. This matters even if you never touch web:
  # flutter/pubspec.yaml overrides the published package with this path, so
  # the fork is what ships in production iOS and Android builds.
  dartchess-fork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/dartchess
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze lib
      - name: Native — the 64-bit int implementation
        run: dart test -x full_perft
      - name: Web — the 32-bit halves (headless Chrome is preinstalled)
        run: |
          dart test -p chrome \
            test/web_perft_test.dart test/square_set_test.dart \
            test/attacks_test.dart test/board_test.dart test/castles_test.dart \
            test/models_test.dart test/setup_test.dart test/debug_test.dart

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds BOTH bundles — brain.js and Maia's separate native one, which
      # reads the same brain/maia/ sources — and runs each one's smoke test and
      # fixture replay.
      - name: Rebuild the brain (runs the smoke tests and replays the fixtures)
        run: npm run build:brain
      # esbuild bundles the Flutter app's own TypeScript without typechecking
      # it, and none of it is reachable from the Svelte app, so `npm run check`
      # never saw it. This is the only thing that does.
      - name: Typecheck the Flutter app's own TypeScript
        run: npm run check:flutter-ts
      - name: The committed bundles must match their TypeScript sources
        run: git diff --exit-code flutter/assets/brain.js flutter/assets/maia-brain.js
      # The maskable PWA icons promise, via manifest.json's purpose field, that
      # their ink fits Android's 80% safe circle. Nothing in the Dart suite can
      # see that — app_icons_test only compares bytes, and on develop the two
      # maskables were byte-identical copies of the plain ones, so the promise
      # was empty. make-icons.py measures the real ink radius on the shipped
      # pixels; without this step it measures it only when a human runs it.
      - name: Icons match their source and fit the maskable safe circle
        # Pillow is not on the runner. The script exits 1 with "needs Pillow"
        # rather than skipping, which is why this was caught the first time the
        # step ran rather than passing vacuously forever.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 scripts/make-icons.py --check
      # the bundled licence texts must match the repo-root originals, or the
      # app ships a stale licence — a real GPL-compliance defect, not a nit
      - name: Bundled licence texts must match root
        run: ./stage-legal.sh && git diff --exit-code assets/legal/
        working-directory: flutter
      # Garbo is vendored once and bundled twice — vendor/garbo is the copy
      # the web build stages, flutter/assets/garbo the one native reads. Two
      # copies that drift are two different opponents wearing one name.
      - name: The bundled Garbo must match the vendored original
        run: |
          diff vendor/garbo/garbochess.js flutter/assets/garbo/garbochess.js
          diff vendor/garbo/LICENSE flutter/assets/garbo/LICENSE
      - run: flutter pub get
        working-directory: flutter
      # integration_test/ is analyzed but never run: it drives a real app on a
      # device and CI has none. Analyzing it still catches the cheap failure —
      # a renamed method it calls, which would otherwise leave CI green.
      - run: flutter analyze lib test integration_test
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      # The SAME tests, compiled to JS and run in a real browser.
      #
      # Not redundant with the line above, and #235 is why. `playable_families`
      # read `MaiaEngine.supported && ChessGptEngine.supported` as one
      # capability; on macOS both getters are true and on this runner both are
      # false, so on every platform the suite ran, `a && b` was
      # indistinguishable from `a`. Only a browser disagrees — Maia has a wasm
      # worker there and ChessGPT has nothing — and Maia vanished from every
      # picker on botvinnik.app, the deploy Flutter owns.
      #
      # The two web BUILD steps below prove the web branch of every conditional
      # import compiles. Nothing proved it behaves. This does, for the platform
      # most users are actually on.
      #
      # `test/*.dart` — top-level only, deliberately NOT `test/`. Tests that
      # genuinely need the VM live in test/vm/ (dart:io, the node bridge,
      # process engines), and one of those in the compile set fails the whole
      # run: `flutter test --platform chrome` compiles every file before it
      # applies any platform filter, so `@TestOn('vm')` does not help. Keeping
      # them in a subdirectory the glob does not reach is what makes this
      # self-maintaining — a new native test goes in test/vm/ and everything
      # else is browser-gated without anyone editing this file.
      #
      # WHY THE LAYOUT TESTS ARE NOT HERE, since it looks like an oversight.
      # Twenty of the files in test/vm/ need dart:io for one reason only: they
      # load the bundled Roboto faces off disk, because the default test font
      # is Ahem (every glyph a uniform square) and a measured height against
      # Ahem is the wrong number. `rootBundle.load` would be the portable
      # replacement — the fonts ARE declared assets — and it does not work:
      # under `flutter test --platform chrome` the asset server is not wired
      # up and the future NEVER COMPLETES, so the suite hangs rather than
      # fails. Tried, measured, reverted. Those tests measure text, so without
      # the real faces they would be worse than absent.
      - name: Flutter tests, in a real browser
        working-directory: flutter
        run: flutter test test/*.dart --platform chrome
      # Also the only thing that type-checks the web branch of every
      # conditional import. Via build-web.sh rather than `flutter build web`
      # so the service worker's manifest is generated and its own guards run
      # (missing required file, unsubstituted bootstrap token). Note it cannot
      # catch an UNPROCESSED sw.js — it is the step that processes it; what
      # protects against that is every build path going through this script.
      # files_web.dart uses package:web instead of dart:html specifically so
      # this build stays possible — dart:html has no wasm compiler support,
      # and that file's header said as much while nothing ran the build the
      # comment was claiming (#159). The value is entirely the exit code.
      #
      # FIRST, before build-web.sh, and that ordering is load-bearing: this is
      # a bare `flutter build web`, so it overwrites build/web WITHOUT
      # --no-web-resources-cdn and with sw.js's manifest placeholder
      # unsubstituted — the two things build-web.sh exists to prevent, whose
      # own header says the protection is "every build path going through this
      # script". Run after it, this leaves a directory nothing should serve,
      # and the e2e suite below only escapes serving it because playwright
      # .config.ts happens to rebuild. Running first makes the residue
      # structurally unreachable rather than accidentally repaired.
      #
      # Catches an UNCONDITIONAL dart:html import, directly or from a
      # dependency. It does NOT catch one behind `if (dart.library.html)`,
      # which is how cross-platform packages usually ship web code, and it
      # does not catch dart:io at all.
      - name: Web build compiles to wasm (dry run, not shipped)
        working-directory: flutter
        run: flutter build web --release --wasm
      - name: Web build, with the offline manifest
        working-directory: flutter
        run: ./build-web.sh
      # The only tests that run the Flutter app in a browser. They matter most
      # for retro, whose every failure path is a silent fallback to Stockfish:
      # a broken retro persona still plays, as somebody else, so nothing short
      # of watching the worker boot catches it.
      #
      # The config's webServer builds again rather than reusing the step above.
      # Deliberate: it keeps `npx playwright test -c flutter/...` a one-liner
      # locally, and a build failure reports as a build failure there rather
      # than as a mysterious server timeout here.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # --grep-invert @network skips the two Maia tests that download ~3.5MB
      # of weights from HuggingFace. Those weights are GPL-3.0 and deliberately
      # not redistributed with the app, so reaching the network on first use is
      # a permanent property of that family rather than a test-environment
      # quirk — and not one worth making CI's uptime depend on. What DOES run
      # here is the guard that matters most: that a non-Maia game makes no
      # third-party request at all.
      - name: Flutter web e2e (engine workers, in a real browser)
        run: npx playwright test -c flutter/playwright.config.ts --grep-invert "@network"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flutter-playwright-traces
          path: flutter/test-results/
          retention-days: 7
